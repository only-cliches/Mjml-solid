name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  runCI:
    uses: ./.github/workflows/CI_PR_merge_checks.yml
  publish:
    needs: runCI
    name: Publish the tagged version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${version}`) { console.error(`Expected tag v${version}, got ${process.env.RELEASE_TAG}`); process.exit(1); }'

      - run: npm install
      - run: npm test
      - run: npm run test-dist-skip-build

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
